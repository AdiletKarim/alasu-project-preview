  document.querySelectorAll("[data-i18n]").forEach(el => {

    if (pack[k] != null) el.textContent = pack[k];
  });
  document.querySelectorAll("[data-cap]").forEach(el => {
    const k = el.getAttribute("data-cap");
    el.textContent = pack.caps[k] || "";
  });
  document.querySelectorAll("img[data-alt]").forEach(el => {
    const k = el.getAttribute("data-alt");
    const t = pack.caps[k] || "";
    el.alt = t.replace(/\s*↗\s*$/, "");
  });
  document.querySelectorAll(".lang button").forEach(btn => {
    btn.setAttribute("aria-pressed", btn.dataset.lang === lang ? "true" : "false");
  });
  try { localStorage.setItem(KEY, lang); } catch (_) {}
}
document.querySelectorAll(".lang button").forEach(btn => {
  btn.addEventListener("click", () => apply(btn.dataset.lang));
});
let start = "kk";
try {
  const saved = localStorage.getItem(KEY);
  if (saved === "kk" || saved === "ru") start = saved;
} catch (_) {}
apply(start);
</script>
</body>
</html>
