<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alasu мобильді экрандар</title>
<style>
*{box-sizing:border-box}
body{max-width:720px;margin:auto;padding:40px 24px;font:16px/1.5 system-ui,sans-serif;color:#182536;background:#f1f5fa}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px}
h1{margin:0;font-size:1.75rem}
p.lead{margin:0 0 28px;color:#4b5d72}
.links{display:grid;gap:14px}
a.card{display:block;padding:20px 22px;background:#fff;border:1px solid #d5e0ec;border-radius:12px;text-decoration:none;color:#182536}
a.card:hover{border-color:#175b9b}
a.card strong{display:block;font-size:1.1rem;color:#175b9b;margin-bottom:4px}
a.card span{color:#4b5d72;font-size:.95rem}
.back{margin-top:28px;display:inline-block;color:#175b9b}
.lang{display:inline-flex;border:1px solid #d5e0ec;border-radius:10px;overflow:hidden;background:#fff}
.lang button{appearance:none;border:0;background:transparent;padding:8px 12px;font:inherit;cursor:pointer;color:#4b5d72}
.lang button[aria-pressed="true"]{background:#175b9b;color:#fff}
a:focus-visible,button:focus-visible{outline:3px solid #175b9b;outline-offset:2px}
</style>
</head>
<body>
<div class="top">
  <h1 data-i18n="title"></h1>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="kk" aria-pressed="true">Қаз</button>
    <button type="button" data-lang="ru" aria-pressed="false">Рус</button>
  </div>
</div>
<p class="lead" data-i18n="lead"></p>
<div class="links">
  <a class="card" href="iphone-screenshots-1.0.0/"><strong data-i18n="iphone"></strong><span data-i18n="iphoneDesc"></span></a>
  <a class="card" href="android-screenshots-1.0.0/"><strong data-i18n="android"></strong><span data-i18n="androidDesc"></span></a>
</div>
<a class="back" href="./" data-i18n="back"></a>
<script>
const I18N = {"kk": {"title": "Alasu мобильді экрандар", "lead": "1.0.0 · демо деректер · қосымшадағы интерфейс — орыс тілінде", "iphone": "iPhone", "iphoneDesc": "57 түпнұсқа сурет · симулятор", "android": "Android", "androidDesc": "56 түпнұсқа сурет · симулятор", "back": "← Alasu жобасының алдын ала қарауы"}, "ru": {"title": "Экраны мобильного Alasu", "lead": "1.0.0 · демо-данные · интерфейс в приложении на русском", "iphone": "iPhone", "iphoneDesc": "57 исходных снимков · симулятор", "android": "Android", "androidDesc": "56 исходных снимков · симулятор", "back": "← Предпросмотр проекта Alasu"}};
const KEY = "alasu-screenshots-lang";
function apply(lang) {
  const pack = I18N[lang] || I18N.kk;
  document.documentElement.lang = lang;
  document.title = pack.title;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const k = el.getAttribute("data-i18n");
    if (pack[k] != null) el.textContent = pack[k];
  });
  document.querySelectorAll(".lang button").forEach(btn => {
    btn.setAttribute("aria-pressed", btn.dataset.lang === lang ? "true" : "false");
  });
  try { localStorage.setItem(KEY, lang); } catch (_) {}
}
document.querySelectorAll(".lang button").forEach(btn => {
  btn.addEventListener("click", () => apply(btn.dataset.lang));
});
let start = "kk";
try {
  const saved = localStorage.getItem(KEY);
  if (saved === "kk" || saved === "ru") start = saved;
} catch (_) {}
apply(start);
</script>
</body>
</html>
